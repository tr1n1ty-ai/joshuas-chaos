[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "joshuas-chaos"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
]

[project.scripts]
joshuas-chaos = "joshuas_chaos.main:cli_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: unit tests (no real AWS)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
